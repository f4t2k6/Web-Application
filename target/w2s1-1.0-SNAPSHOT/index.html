<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Survey</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
        .container {
            width: 500px;
            margin: 30px auto;
            background-color: #ffffff;
            padding: 20px 30px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        .logo {
            display: block;
            margin: 0 auto 10px auto;
            max-width: 150px;
        }
        h1 {
            text-align: center;
            color: #2e6da4;
        }
        fieldset {
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        legend {
            font-weight: bold;
            color: #2e6da4;
            padding: 0 5px;
        }
        label {
            display: inline-block;
            width: 150px;
            margin-top: 8px;
        }
        input[type="text"], input[type="email"], input[type="number"] {
            width: 220px;
            padding: 4px;
            margin-top: 8px;
        }
        .radio-group label, .checkbox-group label {
            width: auto;
            margin-right: 15px;
            font-weight: normal;
        }
        .submit-row {
            text-align: center;
            margin-top: 20px;
        }
        input[type="submit"] {
            background-color: #2e6da4;
            color: #fff;
            border: none;
            padding: 8px 25px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
        }
        input[type="submit"]:hover {
            background-color: #245a8a;
        }
    </style>
</head>
<body>
<div class="container">
    <img src="images/murachlogo.png" alt="Logo" class="logo">
    <h1>Survey</h1>

    <!-- Controller sẽ là SurveyServlet, ánh xạ /SurveyServlet -->
    <form action="SurveyServlet" method="post">

        <fieldset>
            <legend>Your information</legend>

            <label for="fullName">Full name:</label>
            <input type="text" id="fullName" name="fullName" required><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br>

            <label>Date of birth:</label>
            <select name="birthMonth">
                <option value="1">January</option>
                <option value="2">February</option>
                <option value="3">March</option>
                <option value="4">April</option>
                <option value="5">May</option>
                <option value="6">June</option>
                <option value="7">July</option>
                <option value="8">August</option>
                <option value="9">September</option>
                <option value="10">October</option>
                <option value="11">November</option>
                <option value="12">December</option>
            </select>
            <select name="birthDay">
                <!-- 1 - 31 -->
                <option value="1">1</option><option value="2">2</option><option value="3">3</option>
                <option value="4">4</option><option value="5">5</option><option value="6">6</option>
                <option value="7">7</option><option value="8">8</option><option value="9">9</option>
                <option value="10">10</option><option value="11">11</option><option value="12">12</option>
                <option value="13">13</option><option value="14">14</option><option value="15">15</option>
                <option value="16">16</option><option value="17">17</option><option value="18">18</option>
                <option value="19">19</option><option value="20">20</option><option value="21">21</option>
                <option value="22">22</option><option value="23">23</option><option value="24">24</option>
                <option value="25">25</option><option value="26">26</option><option value="27">27</option>
                <option value="28">28</option><option value="29">29</option><option value="30">30</option>
                <option value="31">31</option>
            </select>
            <input type="number" name="birthYear" placeholder="Year" min="1900" max="2026" style="width:80px;">
        </fieldset>

        <fieldset>
            <legend>How did you hear about us?</legend>
            <div class="radio-group">
                <label><input type="radio" name="hearAbout" value="Search engine" checked>Search engine</label>
                <label><input type="radio" name="hearAbout" value="Word of mouth">Word of mouth</label>
                <label><input type="radio" name="hearAbout" value="Social media">Social media</label>
                <label><input type="radio" name="hearAbout" value="Other">Other</label>
            </div>
        </fieldset>

        <fieldset>
            <legend>Would you like to receive announcements about new CDs and special offers?</legend>
            <div class="radio-group">
                <label><input type="radio" name="receiveAnnouncements" value="Yes" checked>Yes</label>
                <label><input type="radio" name="receiveAnnouncements" value="No">No</label>
            </div>
        </fieldset>

        <div class="submit-row">
            <input type="submit" value="Submit">
        </div>

    </form>
</div>
</body>
</html>
